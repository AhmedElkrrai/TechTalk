#JDK
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# iOS simulator/device tests can't run on this Windows host; don't fail the build for it.
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 hard-blocks com.android.library + kotlin.multiplatform in favor of the new
# com.android.kotlin.multiplatform.library plugin. That new plugin isn't supported by
# KSP yet (unresolved: https://github.com/google/ksp/issues/2476), which breaks Room.
# These two flags restore the classic (pre-AGP-9) behavior so Room's documented KSP
# target registration works in :shared. They are read at a point before per-project
# gradle.properties are honored, so they must live here (root), not in shared/. Every
# Android module must therefore apply Kotlin explicitly (org.jetbrains.kotlin.android /
# org.jetbrains.kotlin.multiplatform) rather than relying on AGP's built-in Kotlin
# support. Revisit once KSP supports the new plugin, then remove both flags.
android.builtInKotlin=false
android.newDsl=false